<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jump-dot harness</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /* Harness chrome only: the component under test uses the app stylesheet. */
      .probe-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
      }
      .probe-head {
        flex: 0 0 auto;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border, #2a2a2a);
        font: 12px/1.5 ui-monospace, monospace;
      }
      .probe-head h1 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .probe-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .probe-list li[data-pass="false"] {
        color: #ff6b6b;
      }
      .probe-list li[data-pass="true"] {
        color: #6bd47a;
      }
      .probe-user {
        font-weight: 600;
        font-size: 13px;
      }
      .probe-fill {
        border-radius: 6px;
        background: repeating-linear-gradient(
          180deg,
          rgba(128, 128, 128, 0.16) 0 18px,
          transparent 18px 20px
        );
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/harness/jump-dots.tsx"></script>
  </body>
</html>
