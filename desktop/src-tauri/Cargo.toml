[package]
name = "reasonix-plus-desktop"
version = "1.0.37"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
anyhow = "1"
which = "7"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
# Thin LTO + parallel codegen: fat LTO with codegen-units = 1 was the single
# slowest step of the release job (~3m20s re-linking the cached dep graph into
# one module on a 4-vCPU runner). Thin LTO keeps most of the size/perf win
# while parallelizing across codegen units.
lto = "thin"
codegen-units = 16
panic = "abort"
