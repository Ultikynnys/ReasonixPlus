name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Typecheck the desktop app
        run: npm --prefix desktop run typecheck

      - name: Build the daemon and the frontend bundle
        run: npm --prefix desktop run build:tauri

      - name: Bundle the Windows app
        run: npm --prefix desktop run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: reasonix-plus-windows
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
